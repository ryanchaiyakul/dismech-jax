[project]
name = "dismech-jax"
version = "0.1.0"
description = "DiSMech solver in JAX."
readme = "README.md"
authors = [
    { name = "ryanchaiyakul", email = "ryanchaiyakul@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "diffrax>=0.7.2",
    "equinox>=0.13.4",
    "jax>=0.7.0",
]

[project.optional-dependencies]
cuda13 = [
    "jax[cuda13]>=0.8.0; sys_platform == 'linux'",
]
cuda12 = [
    "jax[cuda12]>=0.7.0; sys_platform == 'linux'",
]
tpu = [
    "jax[tpu]>=0.7.0; sys_platform == 'linux'",
]

[tool.uv]
conflicts = [
    [
        { extra = "cuda12" },
        { extra = "cuda13" },
        { extra = "tpu" },
    ],
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "beartype>=0.22.9",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "optax>=0.2.7",
    "plotly>=6.6.0",
    "ruff>=0.14.14",
]
